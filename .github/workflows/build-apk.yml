name: Build APK and AAB from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # فك ضغط أول ملف zip في جذر المستودع
      - name: Unzip project
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "::error::لا يوجد ملف zip في جذر المستودع"; exit 1; fi
          echo "Unzipping $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          SETTINGS=$(find "$RUNNER_TEMP/src" -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -1)
          if [ -z "$SETTINGS" ]; then echo "::error::لم أجد settings.gradle.kts داخل الـ zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # التوقيع: يعمل فقط إذا أضفت الأسرار في Settings > Secrets and variables > Actions
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: release will be unsigned."
          fi

      - name: Build (debug APK + release APK + release AAB)
        run: gradle -p "$PROJECT_DIR" assembleDebug assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DisasterAlert-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DisasterAlert-release-AAB-for-Google-Play
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: DisasterAlert-release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
